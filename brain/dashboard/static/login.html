<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Juniper — entrar</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="center">
  <main class="card login">
    <img class="logo-big" src="/assets/logo.png" alt="Logo da Juniper" width="160" height="160">
    <h1 class="wordmark">JUNIPER</h1>
    <p class="muted">Entre com o seu client_id e o client_secret.</p>
    <form id="form" autocomplete="off">
      <label for="client-id">Client ID</label>
      <input id="client-id" name="client-id" type="text" required autofocus spellcheck="false" autocapitalize="off">
      <label for="client-secret">Client secret</label>
      <input id="client-secret" name="client-secret" type="password" required spellcheck="false">
      <button type="submit">Entrar</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>
  </main>
  <script src="/assets/login.js"></script>
</body>
</html>
