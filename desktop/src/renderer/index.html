<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Juniper</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <strong>Juniper</strong>
      <span id="status">desconectado</span>
      <label><input type="checkbox" id="pause" /> pausar arquivos</label>
      <button id="voice">voz</button>
      <label><input type="checkbox" id="headset" /> uso fone</label>
      <button id="new">nova conversa</button>
      <button id="logout">sair</button>
    </header>
    <form id="login" hidden>
      <h2>Conectar ao cérebro</h2>
      <input id="url" placeholder="ws://100.x.y.z:8765/v1/ws" autocomplete="off" />
      <input id="cid" placeholder="client_id" autocomplete="off" />
      <input id="secret" type="password" placeholder="client_secret" autocomplete="off" />
      <button type="submit">Conectar</button>
      <p id="login-error"></p>
    </form>
    <div id="update-line" hidden><span id="update-text"></span> <button id="update-apply">Atualizar</button></div>
    <div id="voice-line" hidden></div>
    <main id="messages"></main>
    <aside id="activity" title="O que o computador fez a pedido da Juniper"></aside>
    <form id="composer">
      <input id="text" placeholder="Fale com a Juniper" autocomplete="off" />
      <button type="submit">Enviar</button>
      <button type="button" id="stop">Cancelar</button>
    </form>
    <script src="app.js"></script>
  </body>
</html>
