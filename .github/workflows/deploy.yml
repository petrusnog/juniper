name: Deploy

# Todo merge no master vira deploy na VPS (ADR-013, seção 5): build da imagem, push para o GHCR,
# entra na tailnet com uma chave temporária e roda scripts/deploy.sh por SSH. O deploy só começa
# depois que o workflow "Tests" terminou verde para o mesmo commit.
#
# Atenção: um workflow disparado por `workflow_run` só vale se estiver na branch padrão (master).
# O primeiro deploy é manual: Actions -> Deploy -> Run workflow (branch master).
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Um deploy por vez; um merge novo espera o em andamento (sem cancelá-lo no meio).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - id: commit
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          build-args: GIT_SHA=${{ steps.commit.outputs.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.commit.outputs.sha }}

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Entra na tailnet (nó temporário, tag:ci)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Prepara o SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Os segredos saem mascarados no log, então a causa tem de ser dita aqui, sem imprimi-los.
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS não tem uma linha que comece pelo mesmo texto de DEPLOY_HOST (use o mesmo IP nos dois; a linha é: IP ssh-ed25519 AAAA...)"
            exit 1
          fi
      - name: Deploy na VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd ~/juniper && ./scripts/deploy.sh $SHA"
