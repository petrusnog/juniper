# Produção: brain + MongoDB (ADR-013, T-080). O mesmo arquivo roda na VPS e na sua máquina.
#
#   docker compose -f docker-compose.prod.yml up -d --build   # sobe (e constrói a imagem local)
#   docker compose -f docker-compose.prod.yml ps               # o brain deve ficar "healthy"
#   docker compose -f docker-compose.prod.yml down             # desliga (os dados ficam nos volumes)
#   docker compose -f docker-compose.prod.yml down -v          # desliga e APAGA os dados
#
# Variáveis (no .env desta pasta, que o compose lê para preencher o arquivo):
#   JUNIPER_MEMORY__MONGO__USERNAME / JUNIPER_MEMORY__MONGO__PASSWORD   obrigatórias
#   JUNIPER_IMAGE        imagem do brain (padrão: juniper-brain:local, construída aqui)
#   TAILSCALE_IP         endereço onde publicar a porta (padrão: 127.0.0.1; na VPS, o IP Tailscale)
#   JUNIPER_CONFIG_FILE  config do brain (padrão: docker/config.prod.yaml)
#   COMPOSE_PROFILES=telegram  liga o bot do Telegram (também: `--profile telegram`); veja abaixo
#   JUNIPER_TELEGRAM_BOT_TOKEN / JUNIPER_TELEGRAM__ALLOWED_USER_IDS   o token do bot e quem pode falar com ele
#   JUNIPER_BASE_CONFIG_FILE  seu config pessoal, só completa o que o de produção não define
#                        (padrão: docker/config.base.yaml, vazio)
#   JUNIPER_ENV_FILE     .env com as chaves de LLM (padrão: .env)
#   JUNIPER_CERTS_DIR    pasta com a chave do Google (padrão: certs)
#   JUNIPER_APP_DIR      pasta com o APK publicado do app (padrão: app-release; scripts/publish_app.sh)
#   COMPOSE_PROFILES=searxng  liga o SearXNG, o metabuscador privado da busca na web (ADR-031);
#                        com ele: JUNIPER_SEARXNG_URL=http://searxng:8080, JUNIPER_SEARXNG_SECRET=<aleatório>
#                        e, de preferência, JUNIPER_SEARXNG_IMAGE=searxng/searxng:<tag testada>
#   JUNIPER_TAVILY_API_KEY   (no .env do brain) chave do Tavily, o primeiro provedor da busca
#
# O nome do projeto é outro (juniper-prod) para não encostar nos volumes do docker-compose.yml de
# desenvolvimento (juniper_juniper-mongo-data).
name: juniper-prod

services:
  brain:
    image: ${JUNIPER_IMAGE:-juniper-brain:local}
    build:
      context: .
      target: prod
      args:
        GIT_SHA: ${GIT_SHA:-local}
    container_name: juniper-brain
    restart: unless-stopped
    init: true
    stop_grace_period: 30s   # o brain fecha as conexões com 1012 e conclui a extração de memória
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Nunca em 0.0.0.0: na VPS só o endereço Tailscale (ADR-013, seção 2).
      - "${TAILSCALE_IP:-127.0.0.1}:8765:8765"
      # O dashboard (ADR-020), somente leitura, também só na tailnet.
      - "${TAILSCALE_IP:-127.0.0.1}:8766:8766"
    environment:
      # A senha do Mongo e as chaves de LLM vêm do .env montado abaixo, não daqui.
      JUNIPER_CONFIG_PATH: /home/juniper/.juniper/config.yaml
      # O seu config pessoal (agendas do Google etc.) entra como camada base: só completa o que o
      # config.prod.yaml não define. O padrão é um arquivo vazio versionado (T-094).
      JUNIPER_BASE_CONFIG_PATH: /home/juniper/.juniper/config.base.yaml
      # O SearXNG (perfil `searxng`): vazio = o provedor é pulado no failover da busca (ADR-031).
      JUNIPER_WEB__SEARCH__SEARXNG_URL: ${JUNIPER_SEARXNG_URL:-}
    volumes:
      # Segredos e configuração: montados do servidor, só leitura. Nada disso está na imagem.
      - ${JUNIPER_CONFIG_FILE:-./docker/config.prod.yaml}:/home/juniper/.juniper/config.yaml:ro
      - ${JUNIPER_BASE_CONFIG_FILE:-./docker/config.base.yaml}:/home/juniper/.juniper/config.base.yaml:ro
      - ${JUNIPER_ENV_FILE:-./.env}:/home/juniper/.juniper/.env:ro
      - ${JUNIPER_CERTS_DIR:-./certs}:/home/juniper/.juniper/certs:ro
      # Estado do brain.
      - juniper-state:/home/juniper/.juniper/state     # token dos clientes
      - juniper-logs:/home/juniper/.juniper/logs       # eventos JSONL
      - juniper-models:/home/juniper/.juniper/models   # modelo de embeddings (baixa uma vez)
      # Música: o token de renovação do login no YouTube e o contador de cota (e, no futuro, o uso
      # da voz). Um VOLUME (diretório), nunca um arquivo montado: gravar o token troca o arquivo
      # por outro (rename), o que falha em bind mount de arquivo único. Sobrevive a deploys.
      - juniper-music:/home/juniper/.juniper/music
      # O APK do app Android e o latest.json (scripts/publish_app.sh), só leitura (ADR-026).
      - ${JUNIPER_APP_DIR:-./app-release}:/home/juniper/.juniper/app:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # O bot do Telegram (T-096, ADR-016): um CLIENTE do brain, na mesma imagem. Opt-in: só sobe com
  # `--profile telegram` (ou COMPOSE_PROFILES=telegram no .env). Menor privilégio: não monta o .env
  # (não recebe a senha do Mongo nem as chaves de LLM), não publica porta e só lê o token do brain.
  telegram:
    profiles: ["telegram"]
    image: ${JUNIPER_IMAGE:-juniper-brain:local}
    container_name: juniper-telegram
    restart: unless-stopped
    init: true
    command: ["telegram"]
    depends_on:
      brain:
        condition: service_healthy
    environment:
      JUNIPER_CONFIG_PATH: /home/juniper/.juniper/config.yaml
      # Cliente: fala com o brain pelo nome do serviço, na rede do compose (não pela escuta 0.0.0.0).
      JUNIPER_DEPLOYMENT__SERVER__HOST: brain
      # Vazio = o bot recusa subir (sem token) ou não atende ninguém (sem lista de permissão).
      JUNIPER_TELEGRAM_BOT_TOKEN: ${JUNIPER_TELEGRAM_BOT_TOKEN:-}
      JUNIPER_TELEGRAM__ALLOWED_USER_IDS: ${JUNIPER_TELEGRAM__ALLOWED_USER_IDS:-[]}
    volumes:
      # Sempre o de produção (só `deployment`): nunca o seu config pessoal, que o bot não precisa ver.
      - ./docker/config.prod.yaml:/home/juniper/.juniper/config.yaml:ro
      - juniper-state:/home/juniper/.juniper/state:ro      # só para ler o token dos clientes
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-m", "brain", "telegram", "--health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # O SearXNG (ADR-031): metabuscador privado, o segundo provedor da busca na web. Opt-in, como o
  # bot: só sobe com `--profile searxng` (ou COMPOSE_PROFILES=searxng). Sem porta publicada, só o
  # brain o alcança, em searxng:8080; o segredo vem do .env e as configurações do arquivo montado.
  searxng:
    profiles: ["searxng"]
    image: ${JUNIPER_SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: juniper-searxng
    restart: unless-stopped
    init: true
    environment:
      # Vazio = o SearXNG recusa subir com o segredo de fábrica (falha à vista, não em silêncio).
      SEARXNG_SECRET: ${JUNIPER_SEARXNG_SECRET:-}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]   # o que o entrypoint da imagem precisa para trocar de usuário
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:7
    container_name: juniper-prod-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${JUNIPER_MEMORY__MONGO__USERNAME:?defina JUNIPER_MEMORY__MONGO__USERNAME no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${JUNIPER_MEMORY__MONGO__PASSWORD:?defina JUNIPER_MEMORY__MONGO__PASSWORD no .env}
    # Sem `ports`: o banco só existe na rede interna do compose, onde o brain o alcança em
    # mongo:27017. Para olhar o banco da própria máquina: `docker compose exec mongo mongosh`.
    volumes:
      - juniper-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  juniper-mongo-data:
  juniper-state:
  juniper-logs:
  juniper-models:
  juniper-music:
